<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harel RAG playground</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3f;
    --text: #e6e8ee; --dim: #8b91a5; --accent: #6ea8fe; --user: #2b3a5c;
    --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; margin-right: 8px; align-self: center; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  select, input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; font-size: 14px; min-width: 90px;
  }
  input[type=checkbox] {
    width: 18px; height: 18px; margin: 7px auto 6px; accent-color: var(--accent);
  }
  select { max-width: 340px; }
  #strategy-desc { flex-basis: 100%; font-size: 12.5px; color: var(--dim); margin: -2px 0 0; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 0 10px; }
  .inner { max-width: 880px; margin: 0 auto; padding: 0 18px; }
  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
    unicode-bidi: plaintext;
  }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; max-width: 92%; }
  .bubble.error { border-color: var(--bad); color: var(--bad); }
  .meta { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .cites { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .cite {
    font-size: 12px; background: rgba(110,168,254,.12); color: var(--accent);
    border: 1px solid rgba(110,168,254,.35); border-radius: 999px; padding: 2px 10px;
    direction: ltr; text-decoration: none;
  }
  a.cite:hover { background: rgba(110,168,254,.25); text-decoration: underline; }
  .ctx .hdr a { color: inherit; text-decoration: none; }
  .ctx .hdr a:hover { text-decoration: underline; }
  .cite .q { color: var(--dim); }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 12.5px; color: var(--dim); user-select: none; }
  .ctx {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    margin: 6px 0; font-size: 13px; background: var(--panel);
  }
  .ctx .hdr { font-size: 11.5px; color: var(--accent); direction: ltr; margin-bottom: 4px; }
  .ctx .txt { color: var(--dim); white-space: pre-wrap; unicode-bidi: plaintext; max-height: 130px; overflow-y: auto; }
  footer { padding: 12px 18px 18px; background: var(--panel); border-top: 1px solid var(--border); }
  .composer { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 14px; font-size: 15px; resize: none;
    unicode-bidi: plaintext; font-family: inherit;
  }
  #q:focus, select:focus, input:focus { outline: 1px solid var(--accent); }
  #send {
    background: var(--accent); color: #0b1020; border: 0; border-radius: 12px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .45; cursor: default; }
  .row-actions { max-width: 880px; margin: 6px auto 0; display: flex; justify-content: space-between; }
  .row-actions button { background: none; border: 0; color: var(--dim); font-size: 12px; cursor: pointer; }
  .row-actions button:hover { color: var(--text); }
  .typing { color: var(--dim); font-size: 14px; }
  .typing::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stage {
    font-size: 12px; border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; color: var(--dim); direction: ltr;
  }
  .stage.active { color: var(--accent); border-color: var(--accent); }
  .stage.active::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  .stage.done { color: var(--good); border-color: rgba(74,222,128,.5); }
  .stage.failed { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<header>
  <div class="brand">Harel RAG playground</div>
  <div class="field"><label>Chat strategy</label><select id="strategy"></select></div>
  <div class="field"><label>DB strategy</label><select id="db"></select></div>
  <div class="field"><label>Model</label><select id="model"></select></div>
  <span id="params" style="display:contents"></span>
  <div class="field"><label>Debug</label><input type="checkbox" id="debug"></div>
  <p id="strategy-desc"></p>
</header>

<div id="chat"><div class="inner" id="messages"></div></div>

<footer>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="שאל שאלה על ביטוח הראל…"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="row-actions">
    <button id="clear">clear conversation</button>
    <span class="typing" id="status"></span>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
let META = null;
let history = [];   // [{role, content}] — sent to the server for multi-turn

async function init() {
  META = await (await fetch('/api/meta')).json();
  fill($('strategy'), META.strategies.map(s => s.name), META.defaults.strategy);
  fill($('db'), META.dbs, META.defaults.db);
  fill($('model'), META.models, META.defaults.model);
  $('strategy').onchange = renderParams;
  renderParams();
}

function fill(sel, items, def) {
  sel.innerHTML = '';
  for (const it of items) {
    const o = document.createElement('option');
    o.value = o.textContent = it;
    sel.appendChild(o);
  }
  sel.value = def;
}

function renderParams() {
  const s = META.strategies.find(x => x.name === $('strategy').value);
  $('strategy-desc').textContent = s.description || '';
  const box = $('params');
  box.innerHTML = '';
  for (const [name, spec] of Object.entries(s.params || {})) {
    const f = document.createElement('div');
    f.className = 'field';
    const lab = document.createElement('label');
    lab.textContent = spec.label || name;
    let inp;
    if (spec.type === 'select') {
      inp = document.createElement('select');
      for (const opt of spec.options || []) {
        const o = document.createElement('option');
        o.value = o.textContent = opt;
        inp.appendChild(o);
      }
      inp.value = spec.default;
    } else if (spec.type === 'bool') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!spec.default;
    } else {
      inp = document.createElement('input');
      inp.type = 'number';
      if (spec.min != null) inp.min = spec.min;
      if (spec.max != null) inp.max = spec.max;
      inp.step = spec.step ?? 1;
      inp.value = spec.default;
      inp.style.width = '80px';
    }
    inp.dataset.param = name;
    f.append(lab, inp);
    box.appendChild(f);
  }
}

function collectParams() {
  const out = {};
  for (const inp of $('params').querySelectorAll('input, select'))
    out[inp.dataset.param] =
      inp.tagName === 'SELECT' ? inp.value :
      inp.type === 'checkbox' ? (inp.checked ? 1 : 0) : Number(inp.value);
  return out;
}

function addMsg(role, node) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.appendChild(node);
  $('messages').appendChild(wrap);
  $('chat').scrollTop = $('chat').scrollHeight;
  return wrap;
}

function bubble(text, cls = '') {
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  b.textContent = text;
  return b;
}

// corpus-relative file → served URL; #page=N jumps browser PDF viewers to the page
function corpusUrl(file, page) {
  return '/corpus/' + encodeURI(file) + (page ? `#page=${page}` : '');
}

function botBubble(r) {
  const b = bubble(r.answer);
  if (r.citations?.length) {
    const c = document.createElement('div');
    c.className = 'cites';
    for (const cit of r.citations) {
      const chip = document.createElement('a');
      chip.className = 'cite';
      chip.href = corpusUrl(cit.file, cit.page);
      chip.target = '_blank';
      chip.textContent = cit.file + (cit.page ? ` · p.${cit.page}` : '');
      if (cit.quote) chip.title = cit.quote;
      c.appendChild(chip);
    }
    b.appendChild(c);
  }
  if (r.contexts?.length) {
    const d = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = `retrieved contexts (${r.contexts.length})`;
    d.appendChild(sum);
    for (const ctx of r.contexts) {
      const div = document.createElement('div');
      div.className = 'ctx';
      const hdr = document.createElement('div');
      hdr.className = 'hdr';
      const link = document.createElement('a');
      link.href = corpusUrl(ctx.file, ctx.page);
      link.target = '_blank';
      link.textContent = `${ctx.file}${ctx.page ? ' · p.' + ctx.page : ''}`;
      hdr.appendChild(link);
      hdr.append(` · ${ctx.domain} · dist ${ctx.distance.toFixed(3)}`);
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = ctx.text;
      div.append(hdr, txt);
      d.appendChild(div);
    }
    b.appendChild(d);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const bits = [];
  if (r.domain) bits.push('domain: ' + r.domain);
  if (r.latency_ms != null) bits.push((r.latency_ms / 1000).toFixed(1) + 's');
  if (r.cost_usd != null) bits.push('~$' + r.cost_usd.toFixed(4));
  if (r.model) bits.push(r.model);
  meta.textContent = bits.join(' · ');
  b.appendChild(meta);
  return b;
}

// Live per-stage progress chips: a "stage" event opens a chip (blue, pulsing);
// the next event closes it — green ✓ with elapsed seconds, or red ✗ on error.
function makeStageTracker(panel) {
  const open = [];
  const close = (t, failed) => {
    const cur = open.pop();
    if (!cur) return;
    cur.el.className = 'stage ' + (failed ? 'failed' : 'done');
    cur.el.textContent =
      `${failed ? '✗' : '✓'} ${cur.name} · ${(t - cur.start).toFixed(1)}s`;
  };
  return {
    enter(name, t) {
      close(t, false);
      const el = document.createElement('span');
      el.className = 'stage active';
      el.textContent = name;
      panel.appendChild(el);
      open.push({ name, el, start: t });
    },
    finish: t => close(t, false),
    fail: t => close(t, true),
  };
}

async function send() {
  const question = $('q').value.trim();
  if (!question || $('send').disabled) return;
  $('q').value = '';
  addMsg('user', bubble(question));
  $('send').disabled = true;
  $('status').textContent = 'thinking';
  const debug = $('debug').checked;
  const panel = document.createElement('div');
  panel.className = 'stages';
  const pending = addMsg('bot', debug ? panel : bubble('', 'typing'));
  const stages = makeStageTracker(panel);
  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        strategy: $('strategy').value,
        db: $('db').value,
        model: $('model').value,
        history,
        params: collectParams(),
      }),
    });
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', data = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'stage') stages.enter(ev.stage, ev.t);
        else if (ev.type === 'error') { stages.fail(ev.t); throw new Error(ev.detail); }
        else if (ev.type === 'result') { stages.finish(ev.t); data = ev.data; }
        $('chat').scrollTop = $('chat').scrollHeight;
      }
    }
    if (!data) throw new Error('stream ended without a result');
    const b = botBubble(data);
    if (debug) b.insertBefore(panel, b.querySelector('.meta'));
    pending.remove();
    addMsg('bot', b);
    history.push({ role: 'user', content: question },
                 { role: 'assistant', content: data.answer });
  } catch (e) {
    const b = bubble(String(e.message || e), 'error');
    if (debug) b.appendChild(panel);
    pending.remove();
    addMsg('bot', b);
  } finally {
    $('send').disabled = false;
    $('status').textContent = '';
    $('q').focus();
  }
}

$('send').onclick = send;
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('clear').onclick = () => { history = []; $('messages').innerHTML = ''; };

init();
</script>
</body>
</html>
